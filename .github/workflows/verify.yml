name: Verify application foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python3 scripts/development/check_baseline.py
      - run: mvn -B -f backend/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          npm run typecheck
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack and verify live catalog
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export IDENTITY_DB_PASSWORD="$(openssl rand -hex 24)"
          export NOTIFICATION_DB_PASSWORD="$(openssl rand -hex 24)"
          export ASSISTANT_DB_PASSWORD="$(openssl rand -hex 24)"
          export RABBITMQ_PASSWORD="$(openssl rand -hex 24)"
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 240
          python3 scripts/development/smoke_check.py
      - if: always()
        run: docker compose down
        env:
          POSTGRES_PASSWORD: teardown-placeholder
          RABBITMQ_PASSWORD: teardown-placeholder
          IDENTITY_DB_PASSWORD: teardown-placeholder
          NOTIFICATION_DB_PASSWORD: teardown-placeholder
          ASSISTANT_DB_PASSWORD: teardown-placeholder
