<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="State transitions">
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#486577"/></marker></defs>
<rect width="1120" height="800" fill="#fff"/>
<text x="560" y="30" font-family="Arial,sans-serif" font-size="19" fill="#173b42" text-anchor="middle">Reservation state machine</text>
<rect x="40" y="85" width="200" height="55" rx="7" fill="#eef7f3" stroke="#31756a" stroke-width="1.5"/>
<text x="140.0" y="110" font-family="Arial,sans-serif" font-size="16" fill="#173b42" text-anchor="middle">ACTIVE</text>
<rect x="790" y="60" width="230" height="55" rx="7" fill="#eef7f3" stroke="#31756a" stroke-width="1.5"/>
<text x="905.0" y="85" font-family="Arial,sans-serif" font-size="16" fill="#173b42" text-anchor="middle">CONFIRMED</text>
<rect x="790" y="170" width="230" height="55" rx="7" fill="#eef7f3" stroke="#31756a" stroke-width="1.5"/>
<text x="905.0" y="195" font-family="Arial,sans-serif" font-size="16" fill="#173b42" text-anchor="middle">CANCELLED</text>
<rect x="790" y="280" width="230" height="55" rx="7" fill="#eef7f3" stroke="#31756a" stroke-width="1.5"/>
<text x="905.0" y="305" font-family="Arial,sans-serif" font-size="16" fill="#173b42" text-anchor="middle">EXPIRED</text>
<polyline points="240,110 500,110 500,87 790,87" fill="none" stroke="#486577" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="520" y="65" font-family="Arial,sans-serif" font-size="12" fill="#173b42" text-anchor="middle">Inspected + consent + valid time</text>
<polyline points="240,120 450,120 450,197 790,197" fill="none" stroke="#486577" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="180" font-family="Arial,sans-serif" font-size="12" fill="#173b42" text-anchor="middle">Explicit cancellation / rejection</text>
<polyline points="240,130 390,130 390,307 790,307" fill="none" stroke="#486577" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="290" font-family="Arial,sans-serif" font-size="12" fill="#173b42" text-anchor="middle">Server time ≥ expires_at</text>
<text x="560" y="390" font-family="Arial,sans-serif" font-size="19" fill="#173b42" text-anchor="middle">Visit state machine</text>
<rect x="25" y="460" width="170" height="55" rx="7" fill="#eef7f3" stroke="#31756a" stroke-width="1.5"/>
<text x="110.0" y="485" font-family="Arial,sans-serif" font-size="16" fill="#173b42" text-anchor="middle">BOOKED</text>
<rect x="250" y="460" width="170" height="55" rx="7" fill="#eef7f3" stroke="#31756a" stroke-width="1.5"/>
<text x="335.0" y="485" font-family="Arial,sans-serif" font-size="16" fill="#173b42" text-anchor="middle">ARRIVED</text>
<rect x="475" y="460" width="170" height="55" rx="7" fill="#eef7f3" stroke="#31756a" stroke-width="1.5"/>
<text x="560.0" y="485" font-family="Arial,sans-serif" font-size="16" fill="#173b42" text-anchor="middle">CALLED</text>
<rect x="700" y="460" width="170" height="55" rx="7" fill="#eef7f3" stroke="#31756a" stroke-width="1.5"/>
<text x="785.0" y="485" font-family="Arial,sans-serif" font-size="16" fill="#173b42" text-anchor="middle">UNLOADING</text>
<rect x="925" y="460" width="170" height="55" rx="7" fill="#eef7f3" stroke="#31756a" stroke-width="1.5"/>
<text x="1010.0" y="485" font-family="Arial,sans-serif" font-size="16" fill="#173b42" text-anchor="middle">COMPLETED</text>
<polyline points="195,487 250,487" fill="none" stroke="#486577" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="420,487 475,487" fill="none" stroke="#486577" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="645,487 700,487" fill="none" stroke="#486577" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="870,487 925,487" fill="none" stroke="#486577" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="560,515 560,570 335,570 335,515" fill="none" stroke="#486577" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="455" y="595" font-family="Arial,sans-serif" font-size="12" fill="#173b42" text-anchor="middle">Recall: release bay; mark unready</text>
<rect x="25" y="670" width="200" height="55" rx="7" fill="#eef7f3" stroke="#31756a" stroke-width="1.5"/>
<text x="125.0" y="695" font-family="Arial,sans-serif" font-size="16" fill="#173b42" text-anchor="middle">CANCELLED / NO_SHOW</text>
<polyline points="110,515 110,670" fill="none" stroke="#486577" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="190" y="640" font-family="Arial,sans-serif" font-size="12" fill="#173b42" text-anchor="middle">Before arrival</text>
<text x="770" y="650" font-family="Arial,sans-serif" font-size="14" fill="#173b42" text-anchor="middle">Bay reserved from CALLED through UNLOADING.</text>
<text x="770" y="680" font-family="Arial,sans-serif" font-size="14" fill="#173b42" text-anchor="middle">COMPLETED releases bay; departure timestamp follows.</text>
<text x="560" y="770" font-family="Arial,sans-serif" font-size="14" fill="#173b42" text-anchor="middle">Reconciliation is a lot-level hold, not a new reservation terminal state.</text>
</svg>