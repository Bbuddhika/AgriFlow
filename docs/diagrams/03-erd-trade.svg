<text x="1040" y="520" font-family="Arial,sans-serif" font-size="12" fill="#173b42" text-anchor="middle">1 : 0..*</text>
<text x="560" y="780" font-family="Arial,sans-serif" font-size="15" fill="#173b42" text-anchor="middle">Cardinality reads from source to target. FK = foreign key; PK = primary key.</text>
<text x="560" y="808" font-family="Arial,sans-serif" font-size="14" fill="#173b42" text-anchor="middle">Buyer/actor FKs reference USERS. Offer acceptance creates at most one reservation.</text>
<text x="560" y="835" font-family="Arial,sans-serif" font-size="14" fill="#173b42" text-anchor="middle">Support entities and remaining foreign keys are specified in the data dictionary.</text>
