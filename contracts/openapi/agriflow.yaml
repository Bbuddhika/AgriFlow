openapi: 3.0.3
info:
  title: Dambulla AgriFlow Foundation API
  version: 0.1.0
  description: Only currently implemented public foundation endpoints. Business APIs are deferred.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/system:
    get:
      operationId: getSystem
      responses:
        '200':
          description: Application identity and development stage
          content:
            application/json:
              schema:
                type: object
                required: [name, version, stage, timezone]
                properties:
                  name: {type: string}
                  version: {type: string}
                  stage: {type: string, enum: [foundation]}
                  timezone: {type: string, example: Asia/Colombo}
  /api/v1/catalog/produce:
    get:
      operationId: listProduceTypes
      responses:
        '200':
          description: Active produce taxonomy in name order; contains no private data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, code, name, unit]
                  properties:
                    id: {type: string, format: uuid}
                    code: {type: string}
                    name: {type: string}
                    unit: {type: string, enum: [kg]}
        '503':
          description: Service unavailable
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      responses:
        '200': {description: Application, database and RabbitMQ ready}
        '503': {description: Application, database or RabbitMQ unavailable}
